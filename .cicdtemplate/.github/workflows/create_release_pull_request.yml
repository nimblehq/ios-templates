name: Create the Release pull request

on: workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create_release_pull_request:
    name: Create Release Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Get release version
        run: |
          filename=$(find . -maxdepth 1 -name "*.xcodeproj" -exec basename {} .xcodeproj \; | head -n 1)
          release_version=$(sed -n 's/.*MARKETING_VERSION *= *\([^;]*\);.*/\1/p' "$filename.xcodeproj/project.pbxproj" | head -n 1 | sed 's/^[^=]*=\s*//' | tr -d ' ')
          echo $release_version
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - uses: nimblehq/github-actions-workflows/create_release_pull_request@81a960887ae4ef7ebdbcbf56cc30232ebc1fb8cd # nimblehq/github-actions-workflows/create_release_pull_request@v0.2.0
        with:
          release_version: ${{ env.RELEASE_VERSION }}
          changelog_configuration: ".github/workflows/configs/changelog-config.json"
          assignee: bot-nimble