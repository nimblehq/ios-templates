name: PR Report

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - README.md
      - AGENTS.md
      - .github/wiki/**
      - template/README.md
      - template/AGENTS.md
  schedule:
    - cron: '0 2 * * 1-5' # weekdays at 9 AM ICT (UTC+7)

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  report:
    name: Post PR Report to Slack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6.0.2
        with:
          fetch-depth: 1

      - name: Find previous successful run
        id: prev_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/pr_report.yml/runs?status=success&per_page=20" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | .[0].id // empty")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download daily TS artifact
        if: steps.prev_run.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # actions/download-artifact@v4.3.0
        with:
          name: pr-report-ts
          run-id: ${{ steps.prev_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run PR Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SLACK_BOT_TOKEN: ${{ secrets.PR_REPORT_SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.PR_REPORT_SLACK_CHANNEL_ID }}
          PR_REPORT_TS_FILE: .pr_report_ts
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ]; then
            echo "Slack secrets not configured, skipping report"
            exit 0
          fi
          python3 scripts/pr_report.py

      - name: Upload daily TS artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4.6.2
        with:
          name: pr-report-ts
          path: .pr_report_ts
          retention-days: 1
          overwrite: true
          include-hidden-files: true
          if-no-files-found: ignore
